# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  api:
    build:
      context: .
    command: sh -c "python -m alembic upgrade head && python -m fastapi run app.py --port 80 --proxy-headers"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`higeki.localhost`) || Host(`higeki.nearata.com`)
      - traefik.http.services.api.loadbalancer.server.port=80
      - traefik.http.middlewares.testheader.headers.customresponseheaders.server=
      - traefik.http.middlewares.testheader.headers.accessControlAllowOriginList=*
      - traefik.http.middlewares.testheader.headers.contentTypeNosniff=true
      - traefik.http.middlewares.testheader.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.testheader.headers.customresponseheaders.Cache-Control=no-store
      - traefik.http.routers.api.middlewares=testheader@docker
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    develop:
      watch:
        - action: sync+restart
          path: ./
          target: ./app
    secrets:
      - postgres_password
    restart: on-failure
  traefik:
    image: traefik:v3.4
    command:
      - --providers.docker=true
      - --entryPoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker.network=proxy
      - --providers.file.filename=/traefik_dynamic.yaml
      - --entrypoints.websecure.http3=true
      - --entrypoints.websecure.http3.advertisedPort=443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.options=default
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.name.transport.respondingTimeouts.idleTimeout=300
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik_dynamic.yaml:/traefik_dynamic.yaml
      - ./higeki.nearata.com.pem:/higeki.nearata.com.pem:ro
      - ./higeki.nearata.com-key.pem:/higeki.nearata.com-key.pem:ro
    networks:
      - proxy
    depends_on:
      - api
    restart: unless-stopped
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - database:/var/lib/postgresql/data
    expose:
      - 5432
    networks:
      - proxy
    ports:
      - 5432:5432
    secrets:
      - postgres_password
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  database:

networks:
  proxy:
    external: false

secrets:
  postgres_password:
    file: ./postgres_password.txt

